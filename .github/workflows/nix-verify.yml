name: Nix Verification

on:
  # PR runs report the status check that `main`'s branch protection requires
  # before a merge/squash. `dev` is not protected, so its runs only report.
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

# One run per PR or branch: a newer push cancels any queued or in-progress run
# for the same ref, so a burst of pushes verifies only the most recent commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  nix-verify:
    name: Verify nix build and develop
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zebra-crosslink
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
      - uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock', 'zebra-crosslink/flake.lock', 'flake.nix', 'zebra-crosslink/flake.nix', 'zebra-crosslink/flake/**/*.nix') }}  # yamllint disable-line rule:line-length
          restore-prefixes-first-match: nix-${{ runner.os }}-
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-primary-key: never
      - name: Verify root nix build
        working-directory: ${{ github.workspace }}
        run: nix build --print-build-logs
      - name: Verify root nix flake check
        working-directory: ${{ github.workspace }}
        run: nix flake check --print-build-logs
      - name: Verify nix build
        run: nix build --print-build-logs
      - name: Verify nix develop cargo build
        run: nix develop --command cargo build
