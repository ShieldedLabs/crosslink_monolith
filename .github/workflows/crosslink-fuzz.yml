name: Crosslink fuzz

# Runs the Crosslink scenario fuzzer (zebrad/tests/crosslink/fuzz.rs) on each push to dev: the
# crosslink test suite first, as a gate, then a time-boxed coverage-guided campaign on every core of
# a Blacksmith runner. The campaign runs a binary built with SanitizerCoverage's edge counters and
# keeps its corpus on a sticky disk: each run first replays the corpus, then mutates its entries,
# adds an input that hits a new edge or has a finding, and at the end distills the corpus to the
# entries that cover its edges (plus findings, kept until they pass). A finding fails the job and
# its inputs and logs are uploaded. Findings are not minimized here: three of them doubled the
# first campaign's 20 minutes. Minimize a downloaded one with crosslink_fuzz_minimize.

on:
  push:
    branches:
      - dev

permissions:
  contents: read

# Pushes to dev come often: a newer push cancels the campaign still running for an older one.
concurrency:
  group: crosslink-fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Fuzz children and the suite log a lot; color codes only get in the way of reading them.
  NO_COLOR: "1"
  # How long the campaign runs, and how many seeds a run owns (it stops at whichever comes first).
  FUZZ_SECS: "1200"
  FUZZ_SEEDS_PER_RUN: "1000000"

jobs:
  fuzz:
    name: Suite and campaign
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 75
    defaults:
      run:
        working-directory: zebra-crosslink
    steps:
      - uses: actions/checkout@v4

      # The build directory and Cargo's downloads persist between runs, so a push rebuilds only what
      # it changed.
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-crosslink-fuzz-target
          path: zebra-crosslink/target
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-crosslink-fuzz-cargo-registry
          path: ~/.cargo/registry
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-crosslink-fuzz-cargo-git
          path: ~/.cargo/git
      # The guided campaign's corpus, which each run replays and adds to.
      - uses: useblacksmith/stickydisk@v1
        with:
          key: ${{ github.repository }}-crosslink-fuzz-corpus
          path: ~/crosslink-fuzz-corpus

      - name: Install system packages
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends libclang-dev protobuf-compiler

      - name: Install the pinned toolchain
        # rust-toolchain.toml pins the version; asking for it installs it.
        run: rustup show active-toolchain || rustup toolchain install

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Build the crosslink tests
        run: cargo nextest run --cargo-profile ci-fuzz -p zebrad --test crosslink --no-run

      - name: Crosslink suite
        run: cargo nextest run --cargo-profile ci-fuzz -p zebrad --test crosslink --no-fail-fast

      - name: Build the coverage-instrumented fuzzer
        # Its own target directory, and an explicit target so build scripts and proc macros stay
        # uninstrumented. Only the test binary defines the counters' hook; the zebrad binary the
        # tests depend on is never run, so the hook is left unresolved there.
        env:
          CARGO_TARGET_DIR: target/cov
          RUSTFLAGS: >-
            -Cpasses=sancov-module -Cllvm-args=-sanitizer-coverage-level=3
            -Cllvm-args=-sanitizer-coverage-inline-8bit-counters
            -Clink-arg=-Wl,--unresolved-symbols=ignore-in-object-files
        run: |
          set -o pipefail
          cargo test --profile ci-fuzz --target x86_64-unknown-linux-gnu -p zebrad --test crosslink --no-run --message-format json \
            | python3 -c "
          import sys, json
          for line in sys.stdin:
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if m.get('reason') == 'compiler-artifact' and m.get('target', {}).get('name') == 'crosslink' and m.get('executable'):
                  print(m['executable'])
          " > fuzz-bin.txt
          test -s fuzz-bin.txt && cat fuzz-bin.txt

      - name: Fuzz campaign
        run: |
          BIN=$(cat fuzz-bin.txt)
          # Each run takes its own iteration numbers, which seed its fresh inputs and mutations.
          START=$(( GITHUB_RUN_NUMBER * FUZZ_SEEDS_PER_RUN ))
          END=$(( START + FUZZ_SEEDS_PER_RUN ))
          echo "guided iterations $START..$END for ${FUZZ_SECS}s on $(nproc) workers, corpus of $(ls ~/crosslink-fuzz-corpus | wc -l)" | tee -a "$GITHUB_STEP_SUMMARY"
          # Findings from an earlier run on this build directory would be uploaded again.
          rm -rf target/cov/x86_64-unknown-linux-gnu/tmp/crosslink-fuzz
          # The step shell stops at the first failing command, so the campaign's status is caught
          # rather than left to stop it before the summary.
          set -o pipefail
          status=0
          CROSSLINK_FUZZ_GUIDED=1 CROSSLINK_FUZZ_CORPUS="$HOME/crosslink-fuzz-corpus" \
            CROSSLINK_FUZZ_SEEDS="$START..$END" CROSSLINK_FUZZ_SECS="$FUZZ_SECS" CROSSLINK_FUZZ_JOBS="$(nproc)" \
            CROSSLINK_FUZZ_MINIMIZE=0 \
            "$BIN" fuzz::crosslink_fuzz --exact --ignored --nocapture 2>&1 | tee fuzz.log || status=$?
          grep -aE '^fuzz: ' fuzz.log | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Summarize findings
        if: failure()
        run: |
          {
            echo '### Findings'
            grep -aE '^fuzz (seed|guided)-[^ ]+: .*(Fail|Hang)\(' fuzz.log || echo 'none in the campaign log (the suite or the build failed)'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload findings
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crosslink-fuzz-findings-${{ github.run_number }}
          path: |
            zebra-crosslink/target/cov/x86_64-unknown-linux-gnu/tmp/crosslink-fuzz
            zebra-crosslink/fuzz.log
          if-no-files-found: ignore
          retention-days: 30

      # The corpus as this run left it, to fuzz from or inspect locally.
      - name: Upload the corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crosslink-fuzz-corpus-${{ github.run_number }}
          path: ~/crosslink-fuzz-corpus
          if-no-files-found: ignore
          retention-days: 7
