[package]
name = "tenderlink"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0            # no optimizations
debug = 2   # full debug info (0 = none, 1 = line tables only, 2 = full)
debug-assertions = true
overflow-checks = true
incremental = false      # incremental confuses symbol mapping
codegen-units = 1        # easier to debug single unit
split-debuginfo = "unpacked"  # produce separate .pdb files
lto = false

[dependencies]
blake3 = "1.8.2"
byteorder = "1.5.0"
ed25519-zebra = "4.1.0"
hex = "0.4.3"
crossterm = "0.27" # Only for p2p terminal
tracing = "0.1.41"
base64 = "0.22"
libc = "0.2.182"
rand = "0.9.2"
rand_chacha = "0.9.0"
rand_pcg = "0.9.0"
socket2 = "0.6.1"
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinSock", "Win32_System_IO"] }
static_assertions = "1.1.0"
tokio = { version = "1.47.1", features = ["rt", "rt-multi-thread", "net", "time"] }
zcash_primitives = { path = "../librustzcash/zcash_primitives" } # version = "2.0"
nym-sdk = { git = "https://github.com/ShieldedLabs/nym.git", rev = "2023a668c5ba0127d2751aad7a124e33ec47d081", default-features = false }
nym-bin-common = { git = "https://github.com/ShieldedLabs/nym.git", rev = "2023a668c5ba0127d2751aad7a124e33ec47d081", features = ["basic_tracing"] }
nym-ip-packet-requests = { git = "https://github.com/ShieldedLabs/nym.git", rev = "2023a668c5ba0127d2751aad7a124e33ec47d081" }
smolmix = { git = "https://github.com/ShieldedLabs/nym.git", rev = "2023a668c5ba0127d2751aad7a124e33ec47d081" }
chrono = { version = "0.4.40", default-features = false, features = ["clock"] }

[dependencies.snow]
git = "https://github.com/ShieldedLabs/snow.git"
rev = "54369eb3829d6563ef7e5d5f17c09b08a77bca6e"
default-features = false
features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom"
]
