[package]
name = "zebra-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
winit = "0.30.12"
softbuffer = "0.4.6"
num_cpus = "1.17.0"
ahash = "0.8.12"
rand = "0.9.2"
rustybuzz = "0.20.1"
swash = "0.2.6"
copypasta = "0.10.1"
clay-layout = { path = "../clay-rs" }
wallet = { path = "../wallet" }
chrono = "0.4.44"

# Vorbis decode at the packet level; the ogg demuxer is ours.
lewton = { version = "0.10.2", optional = true, default-features = false }

[build-dependencies]
png = "0.17"

# Host-gated rather than target-gated: cross-building a Windows binary from another OS
# would need this unconditionally, which no build here does.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
# Off by default so headless builds skip all of this
audio = ["dep:lewton"]

[profile.release]
debug = 2   # full debug info (0 = none, 1 = line tables only, 2 = full)
incremental = false      # incremental confuses symbol mapping
codegen-units = 1        # easier to debug single unit
split-debuginfo = "unpacked"  # produce separate .pdb files

[profile.dev]
opt-level = 0            # no optimizations
debug = 2   # full debug info (0 = none, 1 = line tables only, 2 = full)
debug-assertions = true
overflow-checks = true
incremental = false      # incremental confuses symbol mapping
codegen-units = 1        # easier to debug single unit
split-debuginfo = "unpacked"  # produce separate .pdb files
lto = false

[profile.release.package.clay-layout]
opt-level = 0            # no optimizations
debug = 2   # full debug info (0 = none, 1 = line tables only, 2 = full)
debug-assertions = true
overflow-checks = true
incremental = false      # incremental confuses symbol mapping
codegen-units = 1        # easier to debug single unit
split-debuginfo = "unpacked"  # produce separate .pdb files
