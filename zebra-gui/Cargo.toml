[package]
name = "zebra-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Pinned to a commit: the clipboard, the Windows request_frame fix and the macOS close fix (EVENT_CLOSE only from the
# red button or Quit, never from a minimized or hidden window) are in no crates.io release yet.
softer_gui = { git = "https://github.com/ShieldedLabs/softer_gui", rev = "de63f083ea670b4e453710863c83e3d9a03d9906" }
num_cpus = "1.17.0"
ahash = "0.8.12"
rand = "0.9.2"
rustybuzz = "0.20.1"
swash = "0.2.6"
clay-layout = { path = "../clay-rs" }
wallet = { path = "../wallet" }
chrono = "0.4.44"

# Not used directly. indexmap 1.x decides whether `std` exists by probing the
# sysroot from its build script, which cannot succeed for a -Zbuild-std custom
# target like the cosmo ones: it then drops IndexMap's default hasher and `new`,
# and halo2_proofs stops compiling. Naming the feature here settles it by
# unification for every copy in the graph, on any target.
indexmap = { version = "1", features = ["std"] }

# Vorbis decode at the packet level; the ogg demuxer is ours.
lewton = { version = "0.10.2", optional = true, default-features = false }

[build-dependencies]
png = "0.17"
# Only fetched, compiled or run when -F ape is on.
cosmo-build = { version = "9", optional = true }

# Host-gated rather than target-gated: cross-building a Windows binary from another OS
# would need this unconditionally, which no build here does.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[features]
# Off by default so headless builds skip all of this
audio = ["dep:lewton"]

# Build a fat x86-64 + arm64 Actually Portable Executable instead of a native
# binary. build.rs runs the whole build twice more, once per architecture, and
# fuses the halves with apelink; the result lands in target/cosmo/release/.
ape = ["dep:cosmo-build"]

[target.'cfg(cosmo)'.dependencies]
# Translates the libc entry points std calls, whose constants rustc bakes in for
# Linux but cosmopolitan resolves at load time.
cosmo-compat = "9"

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cosmo)'] }

[profile.release]
debug = 2   # full debug info (0 = none, 1 = line tables only, 2 = full)
incremental = false      # incremental confuses symbol mapping
codegen-units = 1        # easier to debug single unit
split-debuginfo = "unpacked"  # produce separate .pdb files

[profile.dev]
opt-level = 0            # no optimizations
debug = 2   # full debug info (0 = none, 1 = line tables only, 2 = full)
debug-assertions = true
overflow-checks = true
incremental = false      # incremental confuses symbol mapping
codegen-units = 1        # easier to debug single unit
split-debuginfo = "unpacked"  # produce separate .pdb files
lto = false

[profile.release.package.clay-layout]
opt-level = 0            # no optimizations
debug = 2   # full debug info (0 = none, 1 = line tables only, 2 = full)
debug-assertions = true
overflow-checks = true
incremental = false      # incremental confuses symbol mapping
codegen-units = 1        # easier to debug single unit
split-debuginfo = "unpacked"  # produce separate .pdb files
