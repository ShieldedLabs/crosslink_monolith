config = { version = "0.15.14", features = ["toml"] }

[workspace.metadata.release]

# We always do releases from the main branch
allow-branch = ["main"]

# Compilation settings

[profile.dev]
panic = "abort"
codegen-units = 1
opt-level = 0

[profile.dev.build-override]
debug = false # when possible
codegen-units = 1
opt-level = 0 # >=1 adds more crates somehow

# Optimise all non-workspace dependencies (crates.io deps)
# Disable debug info for all but a few packages
[profile.dev.package."*"]
debug = false
codegen-units = 1
# opt-level = 1

[profile.dev.package.tenderlink]
debug = true

# Speed up tests by optimizing performance-critical crates

# Cryptographic crates

[profile.dev.package.blake2b_simd]
opt-level = 3

[profile.dev.package.group]
opt-level = 3

[profile.dev.package.halo2_proofs]
opt-level = 3

[profile.dev.package.bls12_381]
opt-level = 3

[profile.dev.package.byteorder]
opt-level = 3

[profile.dev.package.equihash]
opt-level = 3

[profile.dev.package.zcash_proofs]
opt-level = 3

[profile.dev.package.zebra-gui]
opt-level = 3

[profile.dev.package.orchard]
opt-level = 3

[profile.dev.package.softbuffer]
opt-level = 3

[profile.dev.package.swash]
opt-level = 3

[profile.dev.package.winit]
opt-level = 3

[profile.dev.package.rustybuzz]
opt-level = 3
codegen-units = 1

[profile.dev.package.clay-layout]
opt-level = 3
codegen-units = 1

[profile.release]
panic = "abort"
debug = "full" # Don't change. We need debug=full for server debugging!
strip = "none"

# Speed up release builds and sync tests using link-time optimization.
# Some of Zebra's code is CPU-intensive, and needs extra optimizations for peak performance.
#
# TODO:
# - add "-Clinker-plugin-lto" in .cargo/config.toml to speed up release builds
#     - add "-Clinker=clang -Clink-arg=-fuse-ld=lld" in .cargo/config.toml
# - also use LTO on C/C++ code:
#     - use clang to compile all C/C++ code
#     - add "-flto=thin" to all C/C++ code builds
#     - see https://doc.rust-lang.org/rustc/linker-plugin-lto.html#cc-code-as-a-dependency-in-rust
lto = "thin"

# [profile.release-debug]
# inherits = "release"


[workspace.lints.rust]
# The linter should ignore these expected config flags/values
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tokio_unstable)', # Used by tokio-console
    'cfg(zcash_unstable, values("zfuture", "nu6.1", "nu7"))' # Used in Zebra and librustzcash
] }

# core2 has been yanked from crates.io
#
# Pinned by commit (rather than by the mutable `v0.3.3` tag) because `cargo`'s
# vendored-source replacement (used by the `nix` build, see `../flake/toolchain.nix`)
# cannot resolve tag-based git patches against a vendor directory.
[patch.crates-io.core2]
git = "https://github.com/technocreatives/core2.git"
rev = "7bf2611bd9a52b438300c640e142ad5c1298b05b"

# Widen libsqlite3-sys requirement to be compatible with rusqlite 0.37
[patch.crates-io.sqlx-sqlite]
path = "../patches/sqlx-sqlite-0.8.6"

