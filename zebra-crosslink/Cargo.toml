# Common crate metadata:
[workspace.package]
authors = ["Zcash Foundation <zebra@zfnd.org>"]
edition = "2021"
homepage = "https://zfnd.org/zebra/"
keywords = ["zebra", "zcash"]
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/ZcashFoundation/zebra"

[workspace]
members = [
        "wallet",
        "zebrad",
        "zebra-chain",
        "zebra-network",
        "zebra-state",
        "zebra-script",
        "zebra-consensus",
        "zebra-rpc",
        "zebra-node-services",
        "zebra-test",
        "zebra-utils",
        "zebra-crosslink",
        "tower-batch-control",
        "tower-fallback",
        "zebra-crosslink"
]

# Use the edition 2021 dependency resolver in the workspace, to match the crates
resolver = "2"

# `cargo release` settings

[workspace.dependencies]
wallet = { path = "./wallet" }
zcash_address = { path = "../librustzcash/components/zcash_address" }
zcash_encoding = { path = "../librustzcash/components/zcash_encoding" }
zcash_history = { path = "../librustzcash/zcash_history" }
zcash_keys = { path = "../librustzcash/zcash_keys" }
zcash_primitives = { path = "../librustzcash/zcash_primitives" }
zcash_proofs = { path = "../librustzcash/zcash_proofs", features = ["bundled-prover"] }
zcash_transparent = { path = "../librustzcash/zcash_transparent" }
zcash_protocol = { path = "../librustzcash/components/zcash_protocol" }

tenderlink = { path = "../tenderlink" }
zebra-gui = { path = "../zebra-gui" }

incrementalmerkletree = { version = "0.8.2", features = ["legacy-api"] }
shardtree = "0.6.1"
orchard = "0.11"
sapling-crypto = "0.5"
abscissa_core = "0.7"
atty = "0.2.14"
base64 = "0.22.1"
bech32 = "0.11.0"
bellman = "0.14"
bincode = "1.3"
bitflags = "2.9"
bitflags-serde-legacy = "0.1.1"
bitvec = "1.0"
blake2b_simd = "1.0"
blake2s_simd = "1.0"
bls12_381 = "0.8"
bs58 = "0.5"
byteorder = "1.5"
