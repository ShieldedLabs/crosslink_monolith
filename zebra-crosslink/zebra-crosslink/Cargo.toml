[package]
name = "zebra-crosslink"
version = "1.0.0-beta.46"
edition = "2021"

[dependencies]
zebra-chain = { path = "../zebra-chain", version = "11.3.0" }
zebra-state = { path = "../zebra-state", version = "12.0.1" }
zebra-node-services = { path = "../zebra-node-services", version = "9.1.2" }
# The test format calls the block checks directly (CHECK_POW) and supplies the clock (SET_TIME).
zebra-consensus = { path = "../zebra-consensus", version = "14.0.1" }
zebra-debug-time = { workspace = true }
wallet = { path = "../../wallet" }

serde = { workspace = true, features = ["serde_derive"] }
chrono = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros", "tracing", "signal"] }
tower = { workspace = true, features = ["hedge", "limit"] }

tracing = { workspace = true }

# General dependencies
async-trait = "0.1"
rand = "0.8"
serde_json = "1.0"
zerocopy = "=0.8.31"
zerocopy-derive = "=0.8.31"
ed25519-zebra = { workspace = true }
zcash_primitives = { workspace = true }
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true }

static_assertions = { workspace = true }

tenderlink = { workspace = true }
zebra-gui = { workspace = true, features = ["audio"] }

[features]
default = []

