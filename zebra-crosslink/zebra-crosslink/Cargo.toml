[package]
name = "zebra-crosslink"
version = "1.0.0-beta.46"
edition = "2021"

[dependencies]
zebra-chain = { path = "../zebra-chain", version = "2.0.0" }
zebra-state = { path = "../zebra-state", version = "2.0.0" }
zebra-node-services = { path = "../zebra-node-services", version = "1.0.1" }
wallet = { workspace = true }

serde = { workspace = true, features = ["serde_derive"] }
toml = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
rayon = { workspace = true }
tokio = { workspace = true, features = ["time", "rt-multi-thread", "macros", "tracing", "signal"] }
tokio-stream = { workspace = true, features = ["time"] }
tower = { workspace = true, features = ["hedge", "limit"] }
pin-project = { workspace = true }

color-eyre = { workspace = true, features = ["issue-url"] }
# This is a transitive dependency via color-eyre.
# Enable a feature that makes tinyvec compile much faster.
tinyvec = { workspace = true, features = ["rustc_1_55"] }

thiserror = { workspace = true }

tracing-subscriber = { workspace = true, features = ["env-filter"] }
tracing-appender = { workspace = true }
tracing-error = { workspace = true }
tracing-futures = { workspace = true }
tracing = { workspace = true }

# General dependencies
async-trait = "0.1"
bytes = "1.9"
derive-where = "1.2"
eyre = "0.6"
libp2p-identity = "0.2"
multiaddr = "0.18.2"
rand = "0.8"
rand_core = "0.3"
rand_chacha = "0.3.0"
serde_json = "1.0"
tempfile = "3.19.1"
prost = "0.14.1"
strum = "0.26.3"
strum_macros = "0.26.4"
zerocopy = "=0.8.31"
zerocopy-derive = "=0.8.31"
blake3 = "1.8.2"
byteorder = { workspace = true }
ed25519-zebra = { workspace = true }
zcash_primitives = { workspace = true }
zcash_protocol = { workspace = true }
zcash_keys = { workspace = true }

static_assertions = { workspace = true }

# snow = { version = "0.10.0", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-blake2", "use-getrandom"] }


hex = { version = "0.4.3", features = ["serde"] }

tenderlink = { workspace = true }
visualizer_zcash = { workspace = true, optional = true }

[dev-dependencies]
zebra-test = { path = "../zebra-test", version = "1.0.0-beta.45" }

[features]
default = []
viz_gui = ["visualizer_zcash", "visualizer_zcash/audio"]

[build-dependencies]
prost-build = "0.13"

[dependencies.snow]
git = "https://github.com/ShieldedLabs/snow.git"
rev = "54369eb3829d6563ef7e5d5f17c09b08a77bca6e"
default-features = false
features = [
    "use-curve25519",
    "use-chacha20poly1305",
    "use-blake2",
    "use-getrandom"
]
